<section class="panel stack">
  <div class="row"><span class="pill {{ 'bad' if code >= 400 and code != 404 }}">{{ code }}</span><h1>{{ {404: 'Nothing here', 429: 'Slow down a little', 424: 'A service needs attention', 500: 'Something went wrong'}.get(code, 'That did not work') }}</h1></div>
  <p>{{ detail }}</p>
  <div class="row"><a class="btn primary" href="/">Back to your clients</a></div>
</section>
