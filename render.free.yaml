# Render blueprint for the FREE plan (no paid instance, no persistent disk).
# Render's free web services have an ephemeral filesystem and spin down after 15 minutes without traffic, so a SQLite
# file is wiped on every redeploy, restart and spin-down (render.com/docs/free). Two supported ways to run free:
#   1. As is: SQLite in /tmp. Fine for a demo; every page shows a banner that data resets. Sign up again after a reset.
#   2. Persistent: set DATABASE_URL to a free hosted Postgres (e.g. a Neon or Supabase free database) in the
#      Environment tab. Paste the provider's URL as given (postgres://...?sslmode=require); the app converts it.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> choose this file. Add keys in the Environment tab.
services:
  - type: web
    name: growth-os
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/growthos.db   # ephemeral; replace with a hosted Postgres URL to keep data
      - key: APP_BASE_URL
        sync: false          # e.g. https://growth-os.onrender.com (set after the first deploy, then redeploy)
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false          # Gemini judge and extraction (free tier)
      - key: HUNTER_API_KEY
        sync: false          # optional: lead emails
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false          # optional: Gmail sending
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # APP_BASE_URL/auth/gmail/callback, also listed in Google Cloud
      - key: ADMIN_EMAIL
        sync: false          # optional: platform admin created at startup (data view, account managers)
      - key: ADMIN_PASSWORD
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false          # optional: gate signup for the interview link
