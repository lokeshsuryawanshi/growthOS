# Render blueprint: one free Docker web service. Data lives in a hosted Postgres (Neon), so the free plan's ephemeral
# disk and idle spin-down lose nothing. The server holds no AI, search or contact keys: operators save their own.
# Deploy: Render dashboard -> New -> Blueprint -> this repo. Then fill the "sync: false" values in the Environment tab.
# After every deploy: python scripts/check_deploy.py https://<your-service>.onrender.com
services:
  - type: web
    name: growth-os
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string as given (postgres://...-pooler...?sslmode=require)
      - key: APP_BASE_URL
        sync: false          # https://<your-service>.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # a Fernet key; keep it stable or saved API keys can no longer be read
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false          # redirect URI in Google Cloud: APP_BASE_URL/auth/google/callback
      - key: CONTACT_EMAIL
        sync: false          # shown on /login/policy
      - key: ALLOWED_EMAILS
        sync: false          # optional: only these Google accounts may sign in
